<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ kiểm thực</title>
<style>
:root{--nen:#f3f5f4;--the:#fff;--chu:#15201d;--phu:#566560;--vien:#c6d0cc;--chinh:#0c6b57;--chinh-chu:#fff;--do:#b3261e}
@media (prefers-color-scheme:dark){:root{--nen:#0e1412;--the:#161e1b;--chu:#e6ecea;--phu:#9daca7;--vien:#3b4843;--chinh:#52c4a8;--chinh-chu:#07201a;--do:#f2a397}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--nen);color:var(--chu);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
form{width:100%;max-width:360px;padding:26px;background:var(--the);border:1px solid var(--vien);border-radius:14px}
h1{font-size:21px;letter-spacing:-.02em;margin:0 0 2px}
p{margin:0 0 18px;color:var(--phu);font-size:14px}
label{display:block;font-size:13.5px;font-weight:500;margin-bottom:5px}
input{width:100%;font:inherit;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--chu);background:var(--the);border:1px solid var(--vien);border-radius:8px;padding:10px 12px}
input:focus,button:focus-visible{outline:2px solid var(--chinh);outline-offset:1px}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px;background:var(--chinh);color:var(--chinh-chu);cursor:pointer}
#loi{min-height:21px;margin:10px 0 0;color:var(--do)}
</style>
</head>
<body>
<form id="f">
  <h1>Sổ kiểm thực</h1>
  <p>Nhà ăn SEVT 3. Nhập mã truy cập để vào app.</p>
  <label for="ma">Mã truy cập</label>
  <input id="ma" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus required>
  <button>Vào app</button>
  <p id="loi" role="alert"></p>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const loi = document.getElementById('loi');
  loi.textContent = '';
  try {
    const r = await fetch('/api/dang_nhap', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ma:document.getElementById('ma').value})});
    if (r.ok) return location.reload();
    loi.textContent = (await r.json()).loi;
  } catch { loi.textContent = 'Không kết nối được với app. Hãy kiểm tra máy chạy app đang bật.'; }
};
</script>
</body>
</html>
